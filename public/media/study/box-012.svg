<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<!-- Lightbox desk base -->
<rect width="960" height="540" fill="#141312"/>

<!-- Illuminated drawing vellum area -->
<rect x="24" y="20" width="912" height="466" rx="4" fill="#1a1917" stroke="#2a2825" stroke-width="1"/>

<!-- 12-Field Animation Guide Grid (Non-repro Cyan) -->
<g stroke="#263b4a" stroke-width="0.8">
  <rect x="72" y="46" width="816" height="400" fill="none" stroke="#2e485a" stroke-width="1.2"/>
  <rect x="140" y="80" width="680" height="332" fill="none" stroke-dasharray="3 4"/>
  <rect x="208" y="114" width="544" height="264" fill="none" stroke-dasharray="3 4"/>
  <path d="M465 246H495 M480 231V261" stroke="#3d637c" stroke-width="1.2"/>
  <path d="M72 46L92 66 M888 46L868 66 M72 446L92 426 M888 446L868 426" stroke="#2e485a" stroke-width="1"/>
  <path d="M276 242V250 M344 242V250 M412 242V250 M548 242V250 M616 242V250 M684 242V250" stroke="#2e485a"/>
</g>

<!-- ACME Registration Peg Bar along bottom -->
<rect x="24" y="492" width="912" height="38" fill="#100f0e" stroke="#23211f" stroke-width="1"/>
<circle cx="480" cy="511" r="7" fill="#090807" stroke="#302d2a" stroke-width="1.2"/>
<rect x="210" y="505" width="28" height="12" rx="6" fill="#090807" stroke="#302d2a" stroke-width="1.2"/>
<rect x="722" y="505" width="28" height="12" rx="6" fill="#090807" stroke="#302d2a" stroke-width="1.2"/>
<text x="480" y="525" text-anchor="middle" fill="#4d4740" font-family="ui-monospace, monospace" font-size="7.5" letter-spacing="1.5">ACME STANDARD REGISTRATION</text>

<!-- Production Exposure Sheet Stamping -->
<g font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', monospace">
  <text x="80" y="38" fill="#3a5b70" font-size="10" letter-spacing="1.5">12 FIELD · SAFETY GRID</text>
  <text x="880" y="38" text-anchor="end" fill="#5c564e" font-size="9" letter-spacing="1.5">STUDY REF · SQUASH &amp; STRETCH BOX · 24 FPS</text>
  <text x="880" y="70" text-anchor="end" fill="#d97757" font-size="12" font-weight="600" letter-spacing="0.5">FR 012 / 036</text>
  <text x="880" y="86" text-anchor="end" fill="#6e685f" font-size="9" letter-spacing="1">APEX FLOAT · WEIGHTLESS</text>
</g>

<!-- Ground baseline -->
<path d="M72 415H888" stroke="#365469" stroke-width="1.5"/>
<g stroke="#243845" stroke-width="1">
  <path d="M240 415l-5 8 M320 415l-5 8 M400 415l-5 8 M480 415l-5 8 M560 415l-5 8 M640 415l-5 8 M720 415l-5 8"/>
</g>

<!-- Jump trajectory arc guide -->
<path d="M480 415 C450 320 460 170 480 165 C500 170 510 320 480 415" fill="none" stroke="#2e4d61" stroke-width="1.2" stroke-dasharray="3 4"/>

<!-- Height markers -->
<g stroke="#2a4254" stroke-width="0.8" stroke-dasharray="2 3">
  <line x1="380" y1="180" x2="580" y2="180"/>
  <text x="365" y="184" text-anchor="end" fill="#3a5b70" font-family="ui-monospace, monospace" font-size="9">MAX APEX (180)</text>
  <line x1="380" y1="415" x2="580" y2="415"/>
  <text x="365" y="419" text-anchor="end" fill="#3a5b70" font-family="ui-monospace, monospace" font-size="9">BASELINE (415)</text>
</g>

<!-- Ground contact shadow -->
<ellipse cx="480" cy="418" rx="63.0" ry="8.1" fill="#070605" opacity="0.12"/>

<!-- Animated Squash Box (Group with tilt) -->
<g transform="rotate(3.5 480 157.625)">
  <!-- Back / Top facet -->
  <polygon points="453,98.90000000000002 543,98.90000000000002 525,111.50000000000001 435,111.50000000000001"
    fill="#f2a679" stroke="#d97757" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Right side facet -->
  <polygon points="525,111.50000000000001 543,98.90000000000002 543,191.15 525,203.75"
    fill="#b5583b" stroke="#9e472d" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Front main face -->
  <rect x="435.0" y="111.5" width="90.0" height="92.2" rx="4"
    fill="#d97757" stroke="#f09678" stroke-width="1.5"/>

  <!-- Highlight gleam on front face -->
  <line x1="445.0" y1="121.5" x2="515.0" y2="121.5"
    stroke="#ffbe9e" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Center volume cross -->
  <path d="M470.0 157.6 h20 M480 147.6 v20"
    stroke="#7a341e" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Scale indicators -->
  <text x="480.0" y="161.6" text-anchor="middle"
    fill="#ffffff" font-family="ui-monospace, monospace" font-size="10" font-weight="600" opacity="0.9">
    1.00x
  </text>
</g>
</svg>