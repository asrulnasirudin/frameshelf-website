name: Deploy website to GitHub Pages

# Automatically deploys on push to main, and supports manual workflow dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Optional URL base path (leave blank for /<repo-name>/; use / for a custom domain)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Type check, lint, and unit test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build static site into dist/
        env:
          # Priority: explicit workflow input -> configure-pages base_path -> /<repo>/
          SITE_BASE: ${{ inputs.base_path != '' && inputs.base_path || steps.pages.outputs.base_path || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Upload only the built website directory (never repository root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
